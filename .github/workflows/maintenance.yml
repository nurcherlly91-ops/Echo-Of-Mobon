name: Echo of Mobon Automatic Maintenance

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eom-maintenance
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find assets admin/assets -type f -name "*.js" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate important site files
        shell: bash
        run: |
          set -e
          test -s index.html
          test -s admin/index.html
          test -s assets/logo-loader.js
          test -s assets/guest-online.js
          test -s assets/game-center-v1.js
          test -s assets/maintenance-client-v1.js

      - name: Check live homepage
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "https://echoofmobon.com/" -o /tmp/eom-home.html
          grep -qi "Echo of Mobon" /tmp/eom-home.html

      - name: Check live admin page and critical assets
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "https://echoofmobon.com/admin/" -o /tmp/eom-admin.html
          test -s /tmp/eom-admin.html
          for asset in assets/logo-loader.js assets/guest-online.js assets/game-center-v1.js assets/maintenance-client-v1.js; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "https://echoofmobon.com/$asset" -o "/tmp/$(basename "$asset")"
            test -s "/tmp/$(basename "$asset")"
          done

      - name: Verify no admin email is prefilled for guests
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 25 "https://echoofmobon.com/admin/lupa-kata-sandi.html" -o /tmp/eom-forgot.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          pages = ["/tmp/eom-admin.html", "/tmp/eom-forgot.html"]
          for page in pages:
              html = Path(page).read_text(encoding="utf-8")
              match = re.search('<input[^>]*id="adminEmail"[^>]*>', html, re.I)
              if not match:
                  raise SystemExit(f"Admin email field not found in {page}")
              if "value=" in match.group(0).lower():
                  raise SystemExit(f"Privacy regression: admin email is prefilled in {page}")
          print("Privacy check OK: admin email inputs have no preset value.")
          PY

      - name: Validate storage fallback and real public API responses
        shell: bash
        run: |
          set -euo pipefail
          node tests/smoke-public-api.cjs

name: Remove Kapita Welcome Cleanup

on:
  push:
    paths:
      - '.github/workflows/remove-kapita.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Kapita welcome and media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          if index.exists():
              text = index.read_text(encoding='utf-8')
              lines = [line for line in text.splitlines() if 'assets/kapita-welcome.js' not in line]
              index.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          loader = Path('assets/logo-loader.js')
          if loader.exists():
              text = loader.read_text(encoding='utf-8')
              text = text.replace("loadScript('__EOM_KAPITA_WELCOME_LOADING',base+'kapita-welcome.js?v=20261102-2');", '')
              loader.write_text(text, encoding='utf-8')

          for path in Path('assets').glob('kapita-*'):
              if path.is_file():
                  path.unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean"
          else
            git commit -m "chore: remove Kapita welcome and video assets"
            git push origin main
          fi

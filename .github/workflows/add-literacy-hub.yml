name: Install Literacy Adventure Hub

on:
  push:
    paths:
      - '.github/workflows/add-literacy-hub.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install into guest homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          frag = Path('assets/literacy-hub-fragment.html').read_text(encoding='utf-8')

          if 'literacy-adventure-v1.css' not in text:
              text = text.replace('</head>', '  <link rel="stylesheet" href="assets/literacy-adventure-v1.css?v=20261102-1">\n</head>')
          if 'href="#literacy-hub"' not in text:
              text = text.replace('    <a href="#home" data-i18n="home">Beranda</a>', '    <a href="#home" data-i18n="home">Beranda</a>\n    <a href="#literacy-hub">Belajar & Misi</a>')
          if 'class="mobon-slogan"' not in text:
              text = text.replace('      <h1>Echo of<br>Mobon</h1>', '      <h1>Echo of<br>Mobon</h1>\n      <p class="mobon-slogan">An Island of Peace, Unseen by the Eyes, Heard by the Universe</p>')
          if 'id="literacy-hub"' not in text:
              text = text.replace('<main>\n', '<main>\n' + frag + '\n', 1)
          if 'literacy-adventure-v1.js' not in text:
              text = text.replace('</body>', '  <script src="assets/literacy-adventure-v1.js?v=20261102-1"></script>\n</body>')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit installation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to install"
          else
            git commit -m "feat: launch literacy adventure hub and Mobon AI Tutor"
            git push origin main
          fi

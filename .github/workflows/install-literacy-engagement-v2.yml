name: Install Literacy Engagement V2

on:
  push:
    paths:
      - '.github/workflows/install-literacy-engagement-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '<link rel="stylesheet" href="assets/literacy-engagement-v2.css?v=20261102-1">'
          css_anchor = '<link rel="stylesheet" href="assets/literacy-adventure-v1.css?v=20261102-1">'
          if css not in s:
              if css_anchor in s:
                  s = s.replace(css_anchor, css_anchor + '\n  ' + css, 1)
              else:
                  s = s.replace('</head>', '  ' + css + '\n</head>', 1)

          js = '<script src="assets/literacy-engagement-v2.js?v=20261102-1"></script>'
          if js not in s:
              s = s.replace('</body>', '  ' + js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "feat: enable literacy engagement v2"
            git push origin main
          fi

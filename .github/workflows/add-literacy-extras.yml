name: Install Literacy Extras

on:
  push:
    paths:
      - '.github/workflows/add-literacy-extras.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add missing literacy programs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='''        <article class="eom-program"><div class="eom-program-icon">🎪</div><h3>Festival Literasi Mobon</h3><p>Ruang untuk dongeng, puisi, resensi, komik, pameran, dan karya digital.</p><button type="button" data-program="festival">Lihat program →</button></article>'''
          extras='''\n        <article class="eom-program"><div class="eom-program-icon">💡</div><h3>Tahukah Kamu?</h3><p id="eomDidYouKnow">Fakta singkat baru setiap hari untuk memancing rasa ingin tahu.</p><button type="button" data-extra="fact">Fakta lain →</button></article>\n        <article class="eom-program"><div class="eom-program-icon">🎙️</div><h3>Suara Oma & Opa</h3><p>Rekam dongeng, nasihat, dan ingatan keluarga langsung dari perangkat.</p><button type="button" data-extra="voices">Rekam cerita →</button></article>'''
          if 'id="eomDidYouKnow"' not in text and marker in text:
              text=text.replace(marker,marker+extras)
          if 'literacy-extras-v1.js' not in text:
              text=text.replace('</body>','  <script src="assets/literacy-extras-v1.js?v=20261102-1"></script>\n</body>')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit extras
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to install"
          else
            git commit -m "feat: add daily facts and Suara Oma Opa program"
            git push origin main
          fi
